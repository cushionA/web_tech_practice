name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node (TS lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format check (prettier)
        run: npm run format:check
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck

  pr-security:
    name: prompt injection scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Save PR body
        run: |
          mkdir -p .ci
          cat > .ci/pr-body.txt <<'__EOF__'
          ${{ github.event.pull_request.body }}
          __EOF__
      - name: Save diff
        run: git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > .ci/pr.diff
      - name: Run pr-validate.py (vendored)
        run: |
          mkdir -p scripts
          if [ -f .claude/scripts/pr-validate.py ]; then
            python .claude/scripts/pr-validate.py --pr-body .ci/pr-body.txt --diff .ci/pr.diff
          else
            echo "::warning::.claude/scripts/pr-validate.py not present in repo; skipping"
          fi
